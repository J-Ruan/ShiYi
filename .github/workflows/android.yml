name: Android verification
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon clean testDebugUnitTest lint assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Report synthetic test failures
        if: failure()
        run: python3 scripts/report-test-failures.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ShiYi-build-and-reports
          path: |
            app/build/outputs/apk/
            app/build/reports/
  device:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/device-tests.sh
      - name: Report synthetic test failures
        if: failure()
        run: python3 scripts/report-test-failures.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ShiYi-device-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/connected_android_test_additional_output/
      - name: Save generated synthetic screenshots
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/collect-screenshots.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/1.1.0
          if ! git diff --cached --quiet; then
            git commit -m "Update synthetic 1.1.0 UI screenshots [skip ci]"
            git push origin HEAD:main
          fi
