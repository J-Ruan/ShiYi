name: Signed release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (must match app versionName)'
        required: true
        default: '1.1.0'
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/release-check.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify production signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD" && test -n "$EXPECTED_CERT_SHA256"
          keydir=$(mktemp -d "$RUNNER_TEMP/shiyi-signing.XXXXXX")
          trap 'rm -rf "$keydir"' EXIT
          umask 077
          export ANDROID_KEYSTORE_PATH="$keydir/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          ./gradlew --no-daemon clean testDebugUnitTest lint assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$keydir/signature.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$keydir/signature.txt" | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ! rg -q 'CN=Android Debug' "$keydir/signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$keydir/badging.txt"
          rg -q "versionName='$VERSION'" "$keydir/badging.txt"
          ! rg -q 'application-debuggable' "$keydir/badging.txt"
          mkdir -p release-assets
          cp "$apk" "release-assets/ShiYi-$VERSION-release.apk"
          (cd release-assets && sha256sum "ShiYi-$VERSION-release.apk" > SHA256SUMS.txt)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install signed release and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: bash scripts/verify-release-install.sh
      - name: Publish immutable version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "v$VERSION" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo 'Version already exists; refusing replacement'; exit 1
          fi
          gh release create "v$VERSION" release-assets/* --target "$GITHUB_SHA" --title "拾忆 ShiYi $VERSION" --notes-file docs/RELEASE_NOTES.md --latest
